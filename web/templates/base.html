<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BillHub{% endblock %} · BillHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">
</head>
<body>
    {% block header %}{% endblock %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <main>
      {% block body %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='htmx.min.js') }}?v={{ cache_bust }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}?v={{ cache_bust }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
