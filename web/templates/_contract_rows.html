{# 合同表格行（dashboard 初始渲染与搜索 HTMX 刷新共用）#}
{% for r in rows %}
<tr class="contract-row">
  <td class="muted">{{ r.c.contract_no or '—' }}</td>
  <td class="contract-name">{{ r.c.contract_name }}</td>
  <td>{{ r.c.customer_name or '—' }}</td>
  <td class="r">¥{{ r.s.total|money }}</td>
  <td class="r">¥{{ r.s.paid|money }}</td>
  <td class="r {{ 'neg' if r.s.remaining > 0 else 'pos' }}">¥{{ r.s.remaining|money }}</td>
  <td>
    <div class="progress">
      <div class="progress-bar {{ 'done' if r.pct >= 100 }}" style="width:{{ r.pct }}%"></div>
      <span class="progress-text">{{ r.pct }}%</span>
    </div>
  </td>
  <td class="actions-col">
    <button type="button" class="btn-primary btn-sm"
            onclick="openReimburse({{ r.c.id }})">报销</button>
    <button type="button" class="btn-ghost btn-sm expand-btn"
            hx-get="{{ url_for('contracts.detail', cid=r.c.id) }}"
            hx-target="#expand-{{ r.c.id }}" hx-swap="innerHTML"
            onclick="toggleExpand({{ r.c.id }})">详情</button>
    <a href="{{ url_for('contracts.edit', cid=r.c.id) }}" class="btn-ghost btn-sm">编辑</a>
  </td>
</tr>
<tr class="expand-row" id="expand-row-{{ r.c.id }}">
  <td colspan="8"><div id="expand-{{ r.c.id }}" class="expand-content"></div></td>
</tr>
{% else %}
<tr><td colspan="8" class="empty-row">
  {{ '无匹配合同' if q else '暂无合同，点击「＋ 新增合同」开始' }}
</td></tr>
{% endfor %}
