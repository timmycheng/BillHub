{% extends "base.html" %}
{% block title %}更新说明{% endblock %}
{% block crumb %}<span>系统管理</span><span class="sep">/</span><strong>更新说明</strong>{% endblock %}
{% block body %}
<div class="page-head">
  <div>
    <h1>更新说明</h1>
    <p>查看 BillHub 每次更新带来的新功能、优化与修复。</p>
  </div>
</div>

<div class="panel">
  <div class="changelog-intro">
    <p>各版本变更记录，最新改动显示在最上方。</p>
  </div>
  <div class="changelog-doc">
    {% if content_html %}{{ content_html|safe }}{% else %}<p class="muted pad-sm">暂无更新说明</p>{% endif %}
  </div>
</div>
{% endblock %}
