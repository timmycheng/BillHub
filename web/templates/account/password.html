{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block header %}
<header class="topbar">
  <a href="{{ url_for('main.dashboard') }}" class="btn-ghost">‹ 返回</a>
  <div class="brand">修改密码</div>
</header>
{% endblock %}
{% block body %}
<div class="form-wrap narrow">
  <fieldset class="form-section">
    <legend>修改登录密码</legend>
    <form method="post">
      <label class="field"><span>原密码</span>
        <input type="password" name="old_password" required autocomplete="current-password"></label>
      <label class="field"><span>新密码（至少 4 位）</span>
        <input type="password" name="new_password" required autocomplete="new-password"></label>
      <label class="field"><span>确认新密码</span>
        <input type="password" name="confirm_password" required autocomplete="new-password"></label>
      <div class="form-actions">
        <a href="{{ url_for('main.dashboard') }}" class="btn-ghost">取消</a>
        <button type="submit" class="btn-primary">修改</button>
      </div>
    </form>
  </fieldset>
</div>
{% endblock %}
