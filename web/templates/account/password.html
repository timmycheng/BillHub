{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block crumb %}<span>账户</span><span class="sep">/</span><strong>修改密码</strong>{% endblock %}
{% block body %}
<div class="page-head">
  <div>
    <h1>修改密码</h1>
    <p>定期更换密码有助于保障账户安全。</p>
  </div>
</div>
<div class="panel form-panel" style="max-width:480px">
  <form method="post">
    <label class="field"><span>原密码</span>
      <input type="password" name="old_password" required autocomplete="current-password"></label>
    <label class="field"><span>新密码（至少 8 位，含大小写字母和特殊字符）</span>
      <input type="password" name="new_password" required autocomplete="new-password" minlength="8"></label>
    <label class="field"><span>确认新密码</span>
      <input type="password" name="confirm_password" required autocomplete="new-password"></label>
    <div class="form-actions">
      <a href="{{ url_for('main.dashboard') }}" class="btn ghost">取消</a>
      <button type="submit" class="btn primary">修改密码</button>
    </div>
  </form>
</div>
{% endblock %}
