name: Bug 报告
description: 反馈缺陷或异常行为
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 怎么操作会出现这个问题？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 报错信息、截图等
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 出现问题的 BillHub 版本号
    validations:
      required: false
