# BillHub 发版工作流（两种触发方式）
# 1) 一键发版（推荐）：Actions 页面 → Run workflow → 填版本号（如 2.0.2）。
#    自动完成：bump pyproject 版本 → 生成/插入 CHANGELOG 小节 → 提交推送 main
#    → 构建镜像 → 发布 GitHub Release（自动创建 vX.Y.Z 标签，Notes 取 CHANGELOG）→ 邮件分发
# 2) 手动发版（备用）：推送 v* 标签（此时需已自行改好 pyproject 版本与 CHANGELOG）
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发版版本号（如 2.0.2）。留空则用 pyproject.toml 当前版本'
        required: false
      notes:
        description: '追加到 CHANGELOG [Unreleased] 小节的内容（可选；日常改动请直接提交到 Unreleased，此处留空即可）'
        required: false

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  # ============ Job 0：发版准备（仅一键发版时执行步骤；标签推送时保持 success 以免级联跳过下游 job）============
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ver: ${{ steps.commit.outputs.ver }}
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve & validate version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::版本号格式错误：$VER（应为 x.y.z）"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v$VER" | grep -q .; then
            echo "::error::标签 v$VER 已存在，请换一个版本号"; exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Bump version & convert [Unreleased] to version section
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
        run: |
          python3 - <<'PY'
          import datetime, os, re, subprocess, pathlib
          ver = os.environ['RELEASE_VERSION']
          extra = os.environ.get('RELEASE_NOTES', '').strip()
          date = datetime.date.today().isoformat()

          def find_unreleased(text):
              m = re.search(r'^## \[Unreleased\][ \t]*\n?', text, re.M)
              if not m:
                  return None
              body_start = m.end()
              nm = re.search(r'^## \[', text[body_start:], re.M)
              end = body_start + nm.start() if nm else len(text)
              return m.start(), body_start, end

          def gen_from_commits():
              try:
                  last = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip()
                  log = subprocess.check_output(['git', 'log', f'{last}..HEAD', '--pretty=format:- %s']).decode(errors='ignore').strip()
              except subprocess.CalledProcessError:
                  log = subprocess.check_output(['git', 'log', '-10', '--pretty=format:- %s']).decode(errors='ignore').strip()
              return '### 变更\n\n' + (log or '- （无提交说明）')

          ch = pathlib.Path('CHANGELOG.md')
          text = ch.read_text(encoding='utf-8')

          # 1) 追加本次补充说明到 [Unreleased]（无该小节则创建）
          if extra:
              r = find_unreleased(text)
              if r is None:
                  vm = re.search(r'^## \[', text, re.M)
                  block = '## [Unreleased]\n\n' + extra + '\n\n'
                  text = text[:vm.start()] + block + text[vm.start():] if vm else text.rstrip() + '\n\n' + block
              else:
                  s, b, e = r
                  body = text[b:e].rstrip()
                  text = text[:b] + (body + '\n\n' if body else '') + extra + '\n\n' + text[e:]

          # 2) [Unreleased] 转正为新版本小节，并在原位置补一个新的空 [Unreleased]
          r = find_unreleased(text)
          if r is not None:
              s, b, e = r
              body = text[b:e].strip()
              if not body:
                  body = gen_from_commits()
              block = f'## [Unreleased]\n\n## [{ver}] - {date}\n\n{body}\n\n'
              text = text[:s] + block + text[e:]
          else:
              body = gen_from_commits()
              block = f'## [Unreleased]\n\n## [{ver}] - {date}\n\n{body}\n\n'
              vm = re.search(r'^## \[', text, re.M)
              text = text[:vm.start()] + block + text[vm.start():] if vm else text.rstrip() + '\n\n' + block
          ch.write_text(text, encoding='utf-8')

          # 3) bump pyproject.toml 版本号
          p = pathlib.Path('pyproject.toml')
          c = p.read_text(encoding='utf-8')
          m = re.search(r'(?m)(?<=^version = ")[^"]+(?=")', c)
          if not m:
              raise SystemExit('pyproject.toml 中未找到 version 字段')
          p.write_text(c[:m.start()] + ver + c[m.end():], encoding='utf-8')
          print(f'版本已升到 {ver}，[Unreleased] 已转正为新版本小节')
          PY

      - name: Commit & push
        if: github.event_name == 'workflow_dispatch'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: release v$RELEASE_VERSION" || echo '无可提交变更'
          git push origin main
          echo "ver=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  # ============ Job 1：Web Docker 镜像（Linux，导出离线 tar + 推送 Docker Hub）============
  # Docker Hub 推送：命名空间与凭据均走 Secrets（DOCKERHUB_NAMESPACE / DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）。
  # 未配置 → 跳过并警告；已配置但推送失败 → 仅警告，不阻断发版（Release / 邮件照常）。
  build-docker:
    needs: [ prep ]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 必须取 prep 推送后的最新 main，否则版本号停留在发版前的旧值

      - name: Read version
        id: version
        run: echo "ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t billhub-web:${{ steps.version.outputs.ver }} -f Dockerfile.web .

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Tag & push to Docker Hub (latest + version)
        id: push
        if: env.DOCKERHUB_NAMESPACE != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        run: |
          VER=${{ steps.version.outputs.ver }}
          NS=${DOCKERHUB_NAMESPACE}
          docker tag billhub-web:${VER} ${NS}/billhub-web:latest
          docker tag billhub-web:${VER} ${NS}/billhub-web:${VER}
          docker push ${NS}/billhub-web:latest
          docker push ${NS}/billhub-web:${VER}

      - name: Docker Hub push skipped (secrets not configured)
        if: env.DOCKERHUB_NAMESPACE == '' || env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::Docker Hub 推送已跳过：请配置 DOCKERHUB_NAMESPACE / DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Secrets"

      - name: Docker Hub push failed (warning only, 不阻断发版)
        if: steps.push.outcome == 'failure'
        run: echo "::warning::Docker Hub 推送失败（latest / 版本标签），已跳过不阻断发版，请检查凭据与网络"

      - name: Export image (docker save + zstd)
        run: |
          mkdir -p release
          docker save billhub-web:${{ steps.version.outputs.ver }} | zstd -19 -o release/billhub-web-${{ steps.version.outputs.ver }}.tar.zst
          ls -lh release/

      - name: Bundle deploy files
        run: |
          zip -j release/deploy-bundle.zip docker-compose.yml .env.example deploy.md

      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: billhub-web-image
          path: release/billhub-web-*.tar.zst
          if-no-files-found: error

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: release/deploy-bundle.zip
          if-no-files-found: error

  # ============ Job 2：统一发版（需前一个 Job 成功）============
  release:
    needs: [ build-docker ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 必须取 prep 推送后的最新 main，否则读到的版本号是发版前的旧值

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version & extract release notes
        id: version
        run: |
          python3 - <<'PY'
          import os, re, tomllib, pathlib
          ver = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          m = re.search(r'^##\s*\[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=\n^##\s*\[|\Z)',
                        text, re.S | re.M)
          notes = m.group(1).strip() if m else ''
          pathlib.Path('release_notes.md').write_text(notes, encoding='utf-8')
          print(f'ver={ver}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ver={ver}\n')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=${{ steps.version.outputs.ver }}
          TAG="v${VER}"
          ASSETS=()
          for f in \
            artifacts/billhub-web-image/billhub-web-${VER}.tar.zst \
            artifacts/deploy-bundle/deploy-bundle.zip; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，跳过（不删除不重建，避免挪动既有标签）"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "BillHub ${VER}" \
              --notes-file release_notes.md
            echo "Released ${TAG}"
          fi

  # ============ Job 3：邮件分发（Docker 镜像分卷发送，SMTP 与收件地址均走 Secrets）============
  # 需在仓库 Settings → Secrets and variables → Actions 配置：
  #   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS（发件邮箱及授权码）
  #   MAIL_TO（收件人地址，置于 Secrets 保证私密性，不在仓库中明文出现）
  email:
    needs: [ release ]
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SPLIT_DIR: email
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 必须取 prep 推送后的最新 main

      - name: Read version
        id: version
        run: echo "ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: billhub-web-image
          path: image

      - name: Split image into 25MB volumes
        if: env.MAIL_TO != '' && env.SMTP_USER != ''
        run: |
          set -e
          mkdir -p email
          IMG=$(ls image/billhub-web-*.tar.zst | head -1)
          split -b 25m -d -a 3 "$IMG" "$IMG.part"
          mv "$IMG".part* email/
          ls -lh email/ | sed 1d

      - name: Email volumes to recipient
        if: env.MAIL_TO != '' && env.SMTP_USER != ''
        env:
          MAIL_SUBJECT: BillHub v${{ steps.version.outputs.ver }} 镜像分卷
        run: python scripts/send_email.py

      - name: Email skipped (secrets not configured)
        if: env.MAIL_TO == '' || env.SMTP_USER == ''
        run: echo "::warning::邮件分发已跳过：请在仓库 Settings→Secrets and variables→Actions 配置 SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS/MAIL_TO 后重跑本 workflow"
