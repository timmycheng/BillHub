name: Build, Split & Email

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-and-email
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 照抄 build_exe.bat 第 3 步：从 rapidocr 包拷贝 ONNX 模型到项目根 models/
      - name: Prepare OCR models
        run: python -c "import rapidocr_onnxruntime, os, shutil; src=os.path.join(os.path.dirname(rapidocr_onnxruntime.__file__),'models'); dst=os.path.join(os.getcwd(),'models'); os.makedirs(dst,exist_ok=True); [shutil.copy2(os.path.join(src,f),os.path.join(dst,f)) for f in os.listdir(src) if f.endswith('.onnx')]; print('[OK] Models copied')"

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --clean WZBill.spec

      - name: Split exe into 30MB parts
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            Write-Host '7-Zip not found, installing via choco...'
            choco install 7zip -y --no-progress
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path 'release')) { New-Item -ItemType Directory -Path 'release' | Out-Null }
          & $sevenZip a -t7z -v30m -mx=9 release/WZBill.7z dist/WZBill.exe
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Get-ChildItem release | Select-Object Name, Length

      - name: Upload parts as artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: WZBill-parts
          path: release/

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "import re; print(re.search(r'版本：([0-9.]+)', open('main.py', encoding='utf-8').read()).group(1))"
          $tag = "v$version"
          if (gh release view $tag --json tagName 2>$null) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag dist/WZBill.exe `
            --title "WZBill $version" `
            --generate-notes
          Write-Host "Released $tag"

      - name: Email the parts to recipient
        if: success()
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: 12305@wzbank.cn
          SPLIT_DIR: release
          PYTHONIOENCODING: utf-8
        run: python scripts/send_email.py
