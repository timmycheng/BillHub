    "flask-login>=0.6.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
    "pymupdf>=1.28.2",
    "pyqt6>=6.11.0",
    "rapidocr-onnxruntime>=1.4.4",
    "waitress>=3.0.2",
    "xlrd>=2.0.2",
    "xlutils>=2.0.0",
    "xlwt>=1.3.0",
]
